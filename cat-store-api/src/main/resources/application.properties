spring.application.name=cat-store-api
server.port=${PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cat_store}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cat_store}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cat_store}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sparky-92-cau.github.io,http://localhost:8000,http://127.0.0.1:8000}
